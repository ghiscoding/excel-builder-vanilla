packages:
  - 'packages/**'

allowBuilds:
  '@parcel/watcher': false

# Define a catalog of version ranges.
catalog:
  fflate: ^0.8.3
  native-copyfiles: ^2.1.1
  remove-glob: ^1.2.3
  sass: ^1.105.1
  typescript: ^7.0.2
  vite: ^8.3.2

minimumReleaseAge: 2880 # 2 days in minutes

minimumReleaseAgeExclude:
  # exclude packages that I personally maintain and are safe to use on the same day
  - '@lerna-lite/*'
  - native-copyfiles
  - remove-glob

overrides:
  http-cache-semantics: ^4.3.0
  ip-address: ^10.7.3
  undici: ^8.11.2
